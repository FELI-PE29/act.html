<html>
<head>
<title>Formulario de Inscripción</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<h1>Formulario de Inscripción</h1>

<form action="mailto:unaprueba" method="post">

Tipo de documento:
<select name="tipo_documento" required>
<option value="">Seleccione</option>
<option value="cc">Cédula</option>
<option value="ti">Tarjeta de Identidad</option>
<option value="ce">Cédula de Extranjería</option>
</select>
<br><br>

Número de documento:
<input type="text" name="documento" pattern="[0-9]{5,15}" required>
<br><br>

Nombres:
<input type="text" name="nombres" minlength="3" maxlength="64" required>
<br><br>

Apellidos:
<input type="text" name="apellidos" minlength="3" maxlength="64" required>
<br><br>

Dirección:
<input type="text" name="direccion" required>
<br><br>

Teléfono fijo:
<input type="tel" name="telefono_fijo" pattern="[0-9]{7,10}" required>
<br><br>

Teléfono celular:
<input type="tel" name="celular" pattern="[0-9]{10}" required>
<br><br>

Correo electrónico:
<input type="email" name="correo" required>
<br><br>

Usuario:
<input type="text" name="usuario" required>
<br><br>

Password:
<input type="password" name="password" required>
<br><br>

Fecha de inscripción:
<input type="date" name="fecha" required>
<br><br>

Hobbies:<br>
<input type="checkbox"> Deporte<br>
<input type="checkbox"> Música<br>
<input type="checkbox"> Lectura<br>
<input type="checkbox"> Cine<br>
<br>

<input type="submit" value="Enviar">
<input type="reset" value="Limpiar">

</form>

</body>
</html>
